name: Release

# Publishes a signed APK to GitHub Releases whenever a version tag is pushed:
#   git tag v2.0.0 && git push origin v2.0.0
# The tag has to match versionName in app/build.gradle.kts, so a release can never ship the wrong number.
#
# Signing uses four repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# They are only available to runs of this workflow on tags, never to pull requests from forks.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # create the release and attach the APK
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          app_version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$app_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $app_version in app/build.gradle.kts."
            exit 1
          fi
          echo "VERSION=$app_version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run the tests first
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The signing secrets are not set for this repository."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify the signature and name the files
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify "$apk"
          mkdir -p dist
          cp "$apk" "dist/OpenWrt-Manager-v${VERSION}.apk"
          (cd dist && sha256sum "OpenWrt-Manager-v${VERSION}.apk" > "OpenWrt-Manager-v${VERSION}.apk.sha256")

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenWrt Manager ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/OpenWrt-Manager-v${{ env.VERSION }}.apk
            dist/OpenWrt-Manager-v${{ env.VERSION }}.apk.sha256

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
